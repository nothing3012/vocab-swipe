<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101218">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="随手背词">
  <meta name="description" content="一屏一词，滑动查看 Vocabulary in Use 例句与中文翻译。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>随手背词</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101218;
      --panel: #171a22;
      --line: #2b303c;
      --text: #f2f4f8;
      --muted: #a2a9b7;
      --faint: #6f7787;
      --accent: #7aa8ff;
      --accent-soft: #1d2b45;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      touch-action: none;
    }
    .app {
      min-height: 100dvh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
      padding: 0 2px;
      color: var(--faint);
      font-size: 12px;
      letter-spacing: .02em;
    }
    .scene {
      max-width: 48vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #b8c9ea;
      background: var(--accent-soft);
      border: 1px solid #2d4267;
      border-radius: 999px;
      padding: 5px 9px;
      font: inherit;
      width: auto;
      height: auto;
      font-size: 12px;
      line-height: 1.2;
      cursor: pointer;
    }
    .scene::after { content: "⌄"; margin-left: 5px; opacity: .7; }
    .picker {
      position: fixed;
      z-index: 5;
      top: max(54px, calc(env(safe-area-inset-top) + 44px));
      right: 16px;
      left: 16px;
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 8px;
      padding: 10px;
      border: 1px solid #36445e;
      border-radius: 16px;
      background: #1a1f2a;
      box-shadow: 0 16px 42px rgba(0, 0, 0, .38);
    }
    .picker[hidden] { display: none; }
    .picker select {
      min-width: 0;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 9px;
      color: var(--text);
      background: #11151d;
      font: 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      touch-action: auto;
    }
    .counter { font-variant-numeric: tabular-nums; }
    .card {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .24);
      padding: clamp(24px, 6vw, 38px) clamp(22px, 7vw, 44px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: auto;
      transform: translateY(0);
      opacity: 1;
      transition: transform .18s ease, opacity .18s ease;
    }
    .card.leaving-up { transform: translateY(-18px); opacity: 0; }
    .card.leaving-down { transform: translateY(18px); opacity: 0; }
    .sentence {
      margin: 0;
      font-family: ui-serif, "New York", Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 7.4vw, 44px);
      line-height: 1.22;
      letter-spacing: -.018em;
      text-wrap: balance;
    }
    .sentence .target { color: var(--accent); font-weight: 750; }
    .sentence .ipa {
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: .42em;
      font-weight: 500;
      letter-spacing: 0;
      white-space: nowrap;
      margin-left: .4em;
    }
    .translation {
      margin: clamp(18px, 4vh, 34px) 0 0;
      color: #d5d9e1;
      font-size: clamp(17px, 4.7vw, 23px);
      line-height: 1.55;
    }
    .divider {
      width: 32px;
      height: 2px;
      margin: clamp(20px, 4vh, 34px) 0 16px;
      border-radius: 2px;
      background: var(--accent);
      opacity: .75;
    }
    .wordline {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 15px;
      line-height: 1.45;
    }
    .word { color: var(--text); font-weight: 700; }
    .pos { color: var(--faint); font-size: 13px; }
    .meaning {
      margin-top: 7px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .controls {
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      align-items: center;
      min-height: 50px;
    }
    button {
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      background: var(--panel);
      font-size: 24px;
      font-weight: 300;
    }
    button:active { transform: scale(.94); background: #20242e; }
    button.scene:active { transform: none; background: var(--accent-soft); }
    button:disabled { opacity: .28; }
    .gesture-hint {
      justify-self: center;
      color: var(--faint);
      font-size: 12px;
      user-select: none;
    }
    .loading, .error {
      margin: auto;
      color: var(--muted);
      font-size: 16px;
      text-align: center;
      line-height: 1.6;
    }
    @media (min-width: 700px) {
      .app { width: min(620px, 100%); margin: 0 auto; padding-left: 24px; padding-right: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app" aria-live="polite">
    <header class="topbar">
      <span class="counter" id="counter">读取词表…</span>
      <button class="scene" id="scene" aria-expanded="false" aria-controls="picker">Vocabulary in Use</button>
    </header>
    <section class="picker" id="picker" hidden aria-label="选择背词范围">
      <select id="scenePicker" aria-label="场景"></select>
      <select id="batchPicker" aria-label="每组 100 词"></select>
    </section>

    <article class="card" id="card">
      <div class="loading" id="loading">正在准备词表…</div>
      <div id="content" hidden>
        <p class="sentence" id="sentence"></p>
        <p class="translation" id="translation"></p>
        <div class="divider"></div>
        <div class="wordline">
          <span class="word" id="word"></span>
          <span class="pos" id="pos"></span>
        </div>
        <div class="meaning" id="meaning"></div>
      </div>
    </article>

    <nav class="controls" aria-label="切换单词">
      <button id="previous" aria-label="上一个词">‹</button>
      <span class="gesture-hint">上滑看下一个</span>
      <button id="next" aria-label="下一个词">›</button>
    </nav>
  </main>

  <script>
    const STORAGE_KEY = "vocab-swipe-position-v3";
    const LEGACY_STORAGE_KEY = "vocab-swipe-position-v2";
    const BATCH_SIZE = 100;
    const elements = {
      card: document.querySelector("#card"),
      loading: document.querySelector("#loading"),
      content: document.querySelector("#content"),
      counter: document.querySelector("#counter"),
      scene: document.querySelector("#scene"),
      picker: document.querySelector("#picker"),
      scenePicker: document.querySelector("#scenePicker"),
      batchPicker: document.querySelector("#batchPicker"),
      sentence: document.querySelector("#sentence"),
      translation: document.querySelector("#translation"),
      word: document.querySelector("#word"),
      pos: document.querySelector("#pos"),
      meaning: document.querySelector("#meaning"),
      previous: document.querySelector("#previous"),
      next: document.querySelector("#next")
    };

    let words = [];
    let activeIndexes = [];
    let index = 0;
    let touchStartY = null;
    let touchStartX = null;
    let switching = false;

    function appendSentence(entry) {
      const sentence = entry.example || "";
      const highlight = entry.highlight || entry.word || "";
      const lower = sentence.toLocaleLowerCase("en");
      const start = lower.indexOf(highlight.toLocaleLowerCase("en"));
      elements.sentence.replaceChildren();

      if (start < 0) {
        const target = document.createElement("span");
        target.className = "target";
        target.textContent = entry.word;
        elements.sentence.append(target, document.createTextNode(" "));
        appendIPA(entry.pronunciation);
        elements.sentence.append(document.createTextNode(" — " + sentence));
        return;
      }

      elements.sentence.append(document.createTextNode(sentence.slice(0, start)));
      const target = document.createElement("span");
      target.className = "target";
      target.textContent = sentence.slice(start, start + highlight.length);
      elements.sentence.append(target);
      appendIPA(entry.pronunciation);
      elements.sentence.append(document.createTextNode(sentence.slice(start + highlight.length)));
    }

    function appendIPA(value) {
      if (!value) return;
      const ipa = document.createElement("span");
      ipa.className = "ipa";
      ipa.textContent = value;
      elements.sentence.append(ipa);
    }

    function sceneName(value) { return value === "__all__" ? "全部场景" : value; }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        globalIndex: activeIndexes[index] ?? 0,
        scene: elements.scenePicker.value || "__all__",
        batch: Number(elements.batchPicker.value || 0)
      }));
    }

    function populateScenes(savedScene) {
      const scenes = [...new Set(words.map(entry => entry.scene || "通用语境"))];
      elements.scenePicker.replaceChildren();
      [["__all__", "全部场景"], ...scenes.map(scene => [scene, scene])].forEach(([value, label]) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        elements.scenePicker.append(option);
      });
      elements.scenePicker.value = scenes.includes(savedScene) ? savedScene : "__all__";
    }

    function updateActiveIndexes(preferredGlobalIndex, preferredBatch) {
      const scene = elements.scenePicker.value;
      const matching = words.map((entry, i) => i).filter(i => scene === "__all__" || (words[i].scene || "通用语境") === scene);
      const batches = Math.max(1, Math.ceil(matching.length / BATCH_SIZE));
      const suggestedBatch = preferredGlobalIndex === undefined ? Number(preferredBatch || 0) : Math.floor(Math.max(0, matching.indexOf(preferredGlobalIndex)) / BATCH_SIZE);
      const batch = Math.min(Math.max(0, suggestedBatch), batches - 1);
      elements.batchPicker.replaceChildren();
      for (let i = 0; i < batches; i += 1) {
        const option = document.createElement("option");
        const start = i * BATCH_SIZE + 1;
        const end = Math.min((i + 1) * BATCH_SIZE, matching.length);
        option.value = String(i);
        option.textContent = `${start}–${end} 词`;
        elements.batchPicker.append(option);
      }
      elements.batchPicker.value = String(batch);
      activeIndexes = matching.slice(batch * BATCH_SIZE, (batch + 1) * BATCH_SIZE);
      const found = activeIndexes.indexOf(preferredGlobalIndex);
      index = found >= 0 ? found : 0;
    }

    function render() {
      const entry = words[activeIndexes[index]];
      if (!entry) return;
      appendSentence(entry);
      elements.translation.textContent = entry.exampleTranslation;
      elements.word.textContent = entry.word;
      elements.pos.textContent = entry.level ? `· ${entry.level}` : "";
      elements.meaning.textContent = entry.definition;
      const label = `${sceneName(elements.scenePicker.value)} · ${Number(elements.batchPicker.value) + 1}组`;
      elements.scene.textContent = label;
      elements.counter.textContent = `${index + 1} / ${activeIndexes.length}`;
      elements.loading.hidden = true;
      elements.content.hidden = false;
      elements.previous.disabled = index === 0;
      elements.next.disabled = index === activeIndexes.length - 1;
      saveProgress();
    }

    function move(delta) {
      if (!words.length || switching) return;
      switching = true;
      elements.card.classList.add(delta > 0 ? "leaving-up" : "leaving-down");
      window.setTimeout(() => {
        const nextIndex = index + delta;
        if (nextIndex < 0 || nextIndex >= activeIndexes.length) {
          switching = false;
          return;
        }
        index = nextIndex;
        render();
        elements.card.classList.remove("leaving-up", "leaving-down");
        switching = false;
      }, 140);
    }

    elements.next.addEventListener("click", () => move(1));
    elements.previous.addEventListener("click", () => move(-1));
    elements.scene.addEventListener("click", () => {
      const opening = elements.picker.hidden;
      elements.picker.hidden = !opening;
      elements.scene.setAttribute("aria-expanded", String(opening));
    });
    elements.scenePicker.addEventListener("change", () => {
      updateActiveIndexes(undefined, 0);
      elements.picker.hidden = true;
      elements.scene.setAttribute("aria-expanded", "false");
      render();
    });
    elements.batchPicker.addEventListener("change", () => {
      updateActiveIndexes(undefined, elements.batchPicker.value);
      elements.picker.hidden = true;
      elements.scene.setAttribute("aria-expanded", "false");
      render();
    });
    document.addEventListener("keydown", event => {
      if (["ArrowDown", "ArrowRight", " "].includes(event.key)) move(1);
      if (["ArrowUp", "ArrowLeft"].includes(event.key)) move(-1);
    });
    document.addEventListener("touchstart", event => {
      const touch = event.changedTouches[0];
      touchStartY = touch.clientY;
      touchStartX = touch.clientX;
    }, { passive: true });
    document.addEventListener("touchend", event => {
      if (touchStartY === null || touchStartX === null) return;
      const touch = event.changedTouches[0];
      const dy = touch.clientY - touchStartY;
      const dx = touch.clientX - touchStartX;
      touchStartY = null;
      touchStartX = null;
      if (Math.abs(dy) < 44 || Math.abs(dy) < Math.abs(dx) * 1.2) return;
      move(dy < 0 ? 1 : -1);
    }, { passive: true });

    fetch("./vocab.json")
      .then(response => {
        if (!response.ok) throw new Error("词表读取失败");
        return response.json();
      })
      .then(data => {
        words = data;
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (_) {}
        if (!Number.isFinite(saved.globalIndex)) {
          const legacy = Number.parseInt(localStorage.getItem(LEGACY_STORAGE_KEY) || "0", 10);
          saved.globalIndex = Number.isFinite(legacy) ? Math.max(0, legacy) : 0;
        }
        populateScenes(saved.scene);
        updateActiveIndexes(saved.globalIndex, saved.batch);
        render();
      })
      .catch(error => {
        elements.loading.className = "error";
        elements.loading.textContent = `${error.message}，请刷新重试。`;
        elements.counter.textContent = "无法读取";
      });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
    }
  </script>
</body>
</html>
